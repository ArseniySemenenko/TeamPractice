<div class="flex flex-col w-full">
    <div class="dialog-header flex items-center justify-between">
        <h2 mat-dialog-title class="text-white!">Update user</h2>
        <button mat-icon-button (click)="onCancel()" class="mx-5">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <mat-dialog-content>
        <form [formGroup]="form">
            <div class="flex gap-10">
                <div class="flex-1">
                    <mat-form-field appearance="outline" class="text-white!" class="w-full!">
                        <mat-label>Email</mat-label>

                        <input matInput type="text" formControlName="email" />
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="text-white!" class="w-full!">
                        <mat-label>First Name</mat-label>

                        <input matInput type="text" formControlName="first_name" />
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="w-full">
                        <mat-label>Department</mat-label>

                        <mat-select formControlName="dep" disableRipple>
                            @for (dep of departments(); track dep.id) {
                                <mat-option class="text-white!" [value]="dep.id">{{
                                    dep.name
                                }}</mat-option>
                            }
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="text-white!" class="w-full!">
                        <mat-label>Role</mat-label>

                        <input matInput type="text" formControlName="role" />
                    </mat-form-field>
                </div>

                <div class="flex-1">
                    <mat-form-field appearance="outline" class="text-white!" class="w-full!">
                        <mat-label>Password</mat-label>

                        <input matInput type="password" formControlName="password" />
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="text-white!" class="w-full!">
                        <mat-label>Last Name</mat-label>

                        <input matInput type="text" formControlName="last_name" />
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="w-full">
                        <mat-label>Position</mat-label>

                        <mat-select formControlName="position" disableRipple>
                            @for (pos of positions(); track pos.id) {
                                <mat-option class="text-white!" [value]="pos.id">{{
                                    pos.name
                                }}</mat-option>
                            }
                        </mat-select>
                    </mat-form-field>
                </div>
            </div>
        </form>
    </mat-dialog-content>

    <mat-dialog-actions>
        <button matButton="outlined" type="button" class="px-15!" (click)="onCancel()">
            CANCEL
        </button>
        <button
            class="px-15!"
            matButton="filled"
            color="primary"
            type="button"
            (click)="onAdd()"
            [disabled]="form.invalid || isFormChanged()"
        >
            CONFIRM
        </button>
    </mat-dialog-actions>
</div>
